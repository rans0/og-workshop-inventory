name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate wrangler.toml
        run: |
          cat <<EOF > wrangler.toml
          name = "og-workshop-inventory"
          compatibility_date = "2025-01-01"
          pages_build_output_dir = ".open-next/cloudflare"

          [[d1_databases]]
          binding = "DB"
          database_name = "workshop-inventory-db"
          database_id = "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}"
          EOF

      - name: Build
        run: |
          npm run build
          npm run pages:build
        env:
          NEXT_PUBLIC_APP_USERNAME: ${{ secrets.NEXT_PUBLIC_APP_USERNAME }}
          NEXT_PUBLIC_APP_PIN: ${{ secrets.NEXT_PUBLIC_APP_PIN }}
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next/cloudflare --project-name=og-workshop-inventory
